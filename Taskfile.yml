version: '3'

includes:
  VHDL:
    taskfile: ./VHDLTasks.yml
    vars:
      #VIVADOPATH: C:\AMDDesignTools\2026.1\Vivado\bin # Windows default
      #VIVADOPATH: /opt/Xilinx/Vivado/2023.1/bin # Linux default
      VIVADOPATH: '{{if eq OS "windows"}}C:\AMDDesignTools\2026.1\Vivado\bin{{else}}/opt/Xilinx/Vivado/2023.1/bin{{end}}'

      PARTNUMBER: xc7a35tcpg236-1 # BASYS 3 FPGA Part Number
      DEPENDS: # MAP of dependencies for simulations and bit files
        map:

  
tasks:

  test: 
    vars:
      PATH: '{{if eq OS "linux"}}Pooh{{else}}Bear{{end}}'
    cmds: 
      - echo {{if eq OS "windows"}}Yes{{end}}
      - echo {{.PATH}}