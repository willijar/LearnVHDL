version: '3'
# Taskfile for Introduction to VHDL Tasks
# SPDX-FileCopyrightText: 2026 Dr. John A.R. Williams <j.a.r.williams@jarw.org.uk>
# SPDX-License-Identifier: GPL-3.0-or-later

includes:
  VHDL:
    taskfile: ./VHDLTasks.yml
    vars:
      #Set VIVADOPATH to installation directory for Vivado binaries e.g.
      #VIVADOPATH: C:\AMDDesignTools\2026.1\Vivado\bin # Windows default - version 2026.1
      #VIVADOPATH: /opt/Xilinx/Vivado/2023.1/bin       # Linux default - version 2023.1
      VIVADOPATH: '{{if eq OS "windows"}}C:\AMDDesignTools\2026.1\Vivado\bin{{else}}/opt/Xilinx/Vivado/2023.1/bin{{end}}'

      PARTNUMBER: xc7a35tcpg236-1 # BASYS 3 FPGA Part Number
      DEPENDS: # MAP of dependencies for simulations and bit files
        map:
          full_adder_testbench: full_adder.vhd full_adder_testbench.vhd
          clk_prescaler_testbench: clk_prescaler.vhd clk_prescaler_testbench.vhd
          debounce_testbench: debounce.vhd clk_prescaler.vhd debounce_testbench.vhd
          counter_testbench: counter.vhd counter_testbench.vhd
          fourcounter_testbench: clk_prescaler.vhd debounce.vhd counter.vhd fourcounter.vhd fourcounter_testbench.vhd
          full_adder.bit: full_adder.vhd
          fourcounter.bit: debounce.vhd clk_prescaler.vhd counter.vhd fourcounter.vhd
  
tasks:

  full_adder_testbench:
    cmds: 
      - task: VHDL:build:full_adder_testbench:true

  clk_prescaler_testbench:
     cmds: 
      - task: VHDL:build:clk_prescaler_testbench:true

  debounce_testbench:
    cmds: 
      - task: VHDL:build:debounce_testbench:true

  counter_testbench:
    cmds: 
      - task: VHDL:build:counter_testbench:true

  fourcounter_testbench:
    cmds: 
      - task: VHDL:build:fourcounter_testbench:true

  full_adder.bit:
    cmds: 
      - task: VHDL:synthesize:full_adder
          
  fourcounter.bit:
    cmds:
      - task: VHDL:synthesize:fourcounter

  program_full_adder:
    cmds:
      - task: full_adder.bit
      - task: VHDL:program:full_adder.bit

  program_fourcounter:
    cmds:
      - task: fourcounter.bit
      - task: VHDL:program:fourcounter.bit